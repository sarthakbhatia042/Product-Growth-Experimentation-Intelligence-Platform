[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "product-growth-experimentation-intelligence"
version = "1.0.0"
description = "Product Growth & Experimentation Intelligence Platform for Randomized Marketing Interventions and Causal Uplift"
readme = "README.md"
authors = [{ name = "Senior ML & Experimentation Engineer" }]
package-mode = false
requires-python = "^3.10"
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "streamlit>=1.25.0",
    "pytest>=7.4.0",
    "pyyaml>=6.0",
    "requests>=2.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
